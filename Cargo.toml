[package]
name = "agentboard"
version = "0.1.0"
edition = "2024"
description = "A durable local collaboration board for agents"
license = "MIT"
repository = "https://github.com/AssortedFantasy/agentboard"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
similar = "2"
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
